[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integrationtest"
version = "0.1.0"
license = {file = "LICENSE"}
description = "Integration Test framework for Striim operators"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "requests>=2.31", "psycopg2-binary>=2.9", "oracledb>=2", "google-cloud-spanner>=3", "google-cloud-storage>=2", "filelock>=3", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["inttest*"]

[tool.pytest.ini_options]
testpaths = ["tests", "regression", "perf"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib -p inttest.plugin"
pythonpath = ["."]
norecursedirs = ["*.egg-info", ".git", "target", "scratch"]
markers = [
    "integration: integration test (requires Docker services)",
    "postgres: requires Postgres",
    "oracle: requires Oracle",
    "spanner: requires Spanner",
    "gcs: requires the GCS emulator",
    "docker: brings up Docker services (a daemon and the service images); deselect with -m 'not docker'",
]
