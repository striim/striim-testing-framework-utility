name: postgres
compose: compose.yaml            # relative to this file
container: int-postgres
isolation: none                 # fixed qasource/qatarget schemas; per-test isolation is by
                                 # ${TID} table prefix (pgclient.PgAdmin), not a per-test schema
# Later phase: broker support — if INT_PG_HOST is set, reuse a live Postgres (from INT_PG_*
# env) and skip Docker. Logic deferred; wired here so this shape matches scripts/live
# from day one (mirrors scripts/live/services/postgres/service.yaml's SLT_PG_HOST).
live_override_env: INT_PG_HOST
# Docker defaults (used when not live). Base postgres:16 image, no custom build —
# wal2json/logical-decoding (CDC) is not exercised by integration tests, unlike the
# live tier. Same account shape as every other DB service: an admin account (the
# superuser) plus two data accounts + same-named schemas — qasource for source
# tables/connections, qatarget for target tables/connections. A source table T and a
# same-named target table T coexist as qasource.T / qatarget.T.
docker_defaults:
  host: localhost
  port: 15432
  dbname: intdb
  admin_user: postgres          # superuser; creates the roles + schemas via init.sql
  admin_password: striim
  source_user: qasource         # source role; owns + operates in the qasource schema
  source_password: striim
  source_schema: qasource
  target_user: qatarget         # target role; owns + operates in the qatarget schema
  target_password: striim
  target_schema: qatarget
# Published host ports, overridable exactly as compose.yaml interpolates them -- so
# remapping a busy port (or standing up a second stack from another checkout) moves
# the service AND the client that dials it. See inttest/tokens.py::_resolve_service_base.
docker_env:
  port: INT_PG_HOST_PORT
# Live env var names (used when live_override_env is set):
live_env:
  host: INT_PG_HOST
  port: INT_PG_PORT
  dbname: INT_PG_DB
  admin_user: INT_PG_ADMIN_USER
  admin_password: INT_PG_ADMIN_PASSWORD
  source_user: INT_PG_SOURCE_USER
  source_password: INT_PG_SOURCE_PASSWORD
  source_schema: INT_PG_SOURCE_SCHEMA
  target_user: INT_PG_TARGET_USER
  target_password: INT_PG_TARGET_PASSWORD
  target_schema: INT_PG_TARGET_SCHEMA
# Token templates emitted after resolution. {view_host} is the host the STRIIM APP
# uses to reach Postgres — localhost for a native/host Striim, host.docker.internal for
# a containerized Striim. The test harness's own DB connection uses the base
# {host}:{port} (localhost:15432) regardless — so the same published :15432 serves both.
# Source tables live in ${POSTGRES_SOURCE_SCHEMA} (qasource), target tables in
# ${POSTGRES_TARGET_SCHEMA} (qatarget); the reader connects as ${POSTGRES_SOURCE_USER},
# the writer as ${POSTGRES_TARGET_USER}.
provides:
  POSTGRES_HOST: "{view_host}"
  POSTGRES_PORT: "{port}"
  POSTGRES_DB: "{dbname}"
  # Published so inttest/pgclient.py::dsn_from_tokens can build a PgAdmin dsn from the
  # per-test token table alone -- previously reachable only via plugin.py's separate,
  # fixture-side _postgres_tokens() resolver (docs/internals/INTEGRATION-ENGINE.md#token-isolation). Not a
  # new secret exposure: the superuser password is already "striim", hardcoded in the
  # committed compose.yaml, and _postgres_tokens() already published both values into
  # the fixture-based `tokens` fixture.
  POSTGRES_ADMIN_USER: "{admin_user}"
  POSTGRES_ADMIN_PASSWORD: "{admin_password}"
  POSTGRES_SOURCE_USER: "{source_user}"
  POSTGRES_SOURCE_PASSWORD: "{source_password}"
  POSTGRES_SOURCE_SCHEMA: "{source_schema}"
  POSTGRES_TARGET_USER: "{target_user}"
  POSTGRES_TARGET_PASSWORD: "{target_password}"
  POSTGRES_TARGET_SCHEMA: "{target_schema}"
  # No query string: several Tier B test.yaml files (e.g. lookup-simple-lookup)
  # append '?currentSchema=${POSTGRES_SOURCE_SCHEMA}' to route a JDBC pool at the
  # fixed qasource/qatarget schema (docs/internals/INTEGRATION-ENGINE.md#token-isolation) -- table-level
  # isolation is by ${TID} prefix instead, rendered into config.json's content by
  # plugin.py's render_config_file. Keep this value query-string-free, or give it
  # a '&' instead if that ever changes.
  POSTGRES_URL: "jdbc:postgresql://{view_host}:{port}/{dbname}"
