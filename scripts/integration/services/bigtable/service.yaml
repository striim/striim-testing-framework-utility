name: bigtable
compose: compose.yaml            # relative to this file
container: int-bigtable
isolation: none                 # fixed instance/tables; provisioned once per session
# IF INT_BIGTABLE_HOST is set, reuse a live emulator (from INT_BIGTABLE_* env), skip Docker. Logic
# deferred the same way spanner's broker support is deferred; wired here so this shape matches
# scripts/live from day one (mirrors scripts/live/services/bigtable/service.yaml's
# SLT_BIGTABLE_HOST).
live_override_env: INT_BIGTABLE_HOST
python_module: google.cloud.bigtable
python_module_hint: Install the integration engine dependencies, including google-cloud-bigtable.
# Intentionally NO opt_in_env here -- contrast scripts/live/services/bigtable/service.yaml's
# `opt_in_env: SLT_BIGTABLE_SERVICE`. The live service opt-ins because its Striim overlay
# (services/striim/compose.bigtable-emulator.yaml) sets the JVM-global BIGTABLE_EMULATOR_HOST,
# which a reused slt-* cluster would otherwise let the empty emulator hijack on real Bigtable.
# The integration tier has no such overlay: the CBTEMULATOR is reached
# only through the harness's own admin (inttest/bigtableadmin, via inttest/dbroutes.py) at its
# dedicated base port 19470, so nothing is redirected and a non-bigtable test never sees a hijacked
# connection. The model (spanner) is ungated on BOTH tiers, so the gate must stay absent;
# inttest/plugin.py's _require_service_opt_in is a no-op for a service that declares no gate.
docker_defaults:
  host: localhost
  port: 19470                   # gRPC (data + admin); distinct from the live tier's 9470 so both
                                # stacks can run at once (the CBTEMULATOR is one gRPC listener, no
                                # REST/admin split)
  project: test-project
  instance: test-instance
# Published host port, overridable exactly as compose.yaml interpolates it -- so remapping a busy
# port moves the emulator AND the admin client that dials it (mirrors the live tier's docker_env).
docker_env:
  port: INT_BIGTABLE_GRPC_HOST_PORT
live_env:
  host: INT_BIGTABLE_HOST
  port: INT_BIGTABLE_PORT
  project: INT_BIGTABLE_PROJECT
  instance: INT_BIGTABLE_INSTANCE
  emulator_host: INT_BIGTABLE_EMULATOR_HOST
provides:
  BIGTABLE_PROJECT: "{project}"
  BIGTABLE_INSTANCE: "{instance}"
  BIGTABLE_URL: "jdbc:bigtable:/projects/{project}/instances/{instance}?app_profile_id=default"
  BIGTABLE_HOST: "{host}"
  BIGTABLE_GRPC_PORT: "{port}"
  BIGTABLE_EMULATOR_HOST: "{view_host}:{port}"
