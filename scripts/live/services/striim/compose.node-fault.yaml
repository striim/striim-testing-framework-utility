# Optional survivor API for dedicated node-fault stacks.
services:
  slt-node:
    # Each port is published twice, on ${SLT_BIND_ADDRESS} and on ${SLT_BIND_GATEWAY}: all
    # interfaces with neither set; this machine and its containers on a framework run
    # (docs/SETTINGS.md, SLT_BIND_ADDRESS).
    ports:
      - "${SLT_BIND_ADDRESS:-0.0.0.0}:${SLT_STRIIM_NODE_HTTP_HOST_PORT:-9082}:9080"
      - "${SLT_BIND_GATEWAY:-${SLT_BIND_ADDRESS:-0.0.0.0}}:${SLT_STRIIM_NODE_HTTP_HOST_PORT:-9082}:9080"
