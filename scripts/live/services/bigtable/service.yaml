name: bigtable
compose: compose.yaml            # relative to this file
container: slt-bigtable
isolation: none                 # fixed instance/tables; provisioned once per session
# SLT_BIGTABLE_HOST, set, reuses an emulator you run yourself and skips `docker compose up`
# (services.resolve() returns mode="live"/started=False) -- a different intent from remapping the
# published gRPC port via SLT_BIGTABLE_GRPC_HOST_PORT.
live_override_env: SLT_BIGTABLE_HOST
python_module: google.cloud.bigtable
python_module_hint: Install the live engine dependencies, including google-cloud-bigtable.
docker_defaults:
  host: localhost
  port: 9470                    # gRPC (data + admin over one port, unlike Spanner's gRPC+REST split)
  project: test-project
  instance: test-instance
# Published host port, overridable exactly as compose.yaml interpolates it -- so remapping a busy
# port moves the emulator AND the admin client that dials it (services.resolve reads docker_env).
docker_env:
  port: SLT_BIGTABLE_GRPC_HOST_PORT
live_env:
  host: SLT_BIGTABLE_HOST
  port: SLT_BIGTABLE_PORT
  project: SLT_BIGTABLE_PROJECT
  instance: SLT_BIGTABLE_INSTANCE
# Tokens for the Striim app. Striim's Bigtable clients reach the emulator through the JVM-wide
# BIGTABLE_EMULATOR_HOST, which the striim overlay (../striim/compose.bigtable-emulator.yaml) always
# sets, as compose.spanner-emulator.yaml sets SPANNER_EMULATOR_HOST; the URL carries no host. The
# framework's own admin (livetest/bigtableadmin.py) dials the base {host}:{port} (localhost:9470).
provides:
  BIGTABLE_PROJECT: "{project}"
  BIGTABLE_INSTANCE: "{instance}"
  BIGTABLE_URL: "jdbc:bigtable:/projects/{project}/instances/{instance}?app_profile_id=default"
