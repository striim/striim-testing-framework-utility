name: vertica-cdc-diff
depth: smoke
purpose: Rows inserted into Vertica after the app is RUNNING (post_start) are picked up by IncrementalBatchReader's poll (CheckColumn) and written by DatabaseWriter; Vertica has no log-based CDC reader

tql: app.tql

ddl:
  - file: ddl_source.sql   # the source table, in qasource
    db: vertica-source
  - file: ddl_target.sql   # the target table, in qatarget
    db: vertica-target
seed:
  - file: seed.sql
    db: vertica-source
    when: post_start

topology: single
requires: [vertica]

assert:
  smoke: true
  diff:
    - source: ${VERTICA_SOURCE_SCHEMA}.${TID}src     # read via qasource (source_db: vertica-source)
      target: ${VERTICA_TARGET_SCHEMA}.${TID}tgt     # read via qatarget
      source_db: vertica-source
      target_db: vertica-target

timeout: 180
tags: [diff, cdc, vertica, regression]
