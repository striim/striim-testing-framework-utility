name: spanner-googlesql-diff
depth: smoke
purpose: Cloud Spanner emulator (GoogleSQL dialect) same-backend source->target via SpannerBatchReader -> SpannerWriter (mirrors oracle-diff / postgres-diff)

tql: app.tql

ddl:
  - file: spanner_ddl.sql   # Spanner GoogleSQL src + tgt tables
    db: spanner-google
seed:
  - file: seed.sql
    db: spanner-google

topology: single
requires: [spanner]

assert:
  smoke: true
  diff:
    - source: ${TID}src
      source_db: spanner-google
      target: ${TID}tgt
      target_db: spanner-google

timeout: 180
tags: [diff, spanner, googlesql, regression]
