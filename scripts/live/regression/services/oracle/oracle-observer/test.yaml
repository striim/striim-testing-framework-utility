name: oracle-observer
purpose: Oracle observer routes distinguish tagged framework probes from writer logons.
disabled_parallel: Observer views and triggers see all data-user sessions in the PDB; use a serial run on an unshared service.
tql: app.tql
topology: single
requires:
- oracle
timeout: 180
tags:
- oracle
- observer
- regression
ddl:
- file: ddl_source.sql
  db: oracle-source
- file: ddl_target.sql
  db: oracle-target
- file: observer_trigger.sql
  db: oracle-admin
seed:
- file: seed.sql
  db: oracle-source
assert:
  smoke: true
  diff:
  - source: ${ORACLE_SOURCE_SCHEMA}.${TID_ORACLE}SRC
    source_db: oracle-source
    target: ${ORACLE_TARGET_SCHEMA}.${TID_ORACLE}TGT
    target_db: oracle-target
  data:
  - target: ${ORACLE_TARGET_SCHEMA}.${TID_ORACLE}LOGONS
    db: oracle-target
    min_rows: 1
  - target: ${ORACLE_TARGET_SCHEMA}.${TID_ORACLE}WRITERS
    db: oracle-target
    min_rows: 1
  - target: ${ORACLE_TARGET_SCHEMA}.${TID_ORACLE}PROBES
    db: oracle-target
    min_rows: 1
