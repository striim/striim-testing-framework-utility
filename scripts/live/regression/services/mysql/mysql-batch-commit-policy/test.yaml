name: mysql-batch-commit-policy
depth: smoke

# Phase 2.2: Batch and Commit Policy Test
# Tests DatabaseWriter batch and commit behavior during CDC
# Validates:
# - Batch inserts work correctly
# - Commit boundaries are respected
# - Transaction atomicity is maintained
tql: app.tql

# DDL for source and target schemas
ddl:
  - file: ddl_source.sql
    db: mysql-source
  - file: ddl_target.sql
    db: mysql-target

seed:
  - file: seed.sql
    db: mysql-source

topology: single
requires: [mysql]

assert:
  smoke: true
  data:
    - target: ${TID}batch_test_table
      target_db: mysql-target
      rows: 12

timeout: 180
tags: [batch, regression, mysql]
