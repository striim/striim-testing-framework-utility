name: mysql-diff
depth: smoke

tql: app.tql

ddl:
  - file: ddl_source.sql
    db: mysql-source
  - file: ddl_target.sql
    db: mysql-target
seed:
  - file: seed.sql
    db: mysql-source

topology: single
requires: [mysql]

assert:
  smoke: true
  diff:
    - source: ${MYSQL_SOURCE_SCHEMA}.${TID}src
      source_db: mysql-source
      target: ${MYSQL_TARGET_SCHEMA}.${TID}tgt
      target_db: mysql-target

timeout: 180
tags: [diff, regression, mysql]
