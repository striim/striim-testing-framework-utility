name: mssql-cdc-diff
depth: smoke
purpose: SQL Server native CDC (MSSqlReader via SQL Server Agent) from qasource.SRC to qatarget.TGT in the shared qauser DB; seed runs post_start so the capture job records the inserts

tql: app.tql

ddl:
  - file: ddl_source.sql   # qasource.SRC + CDC enable
    db: mssql-source
  - file: ddl_target.sql   # qatarget.TGT
    db: mssql-target
seed:
  - file: seed.sql
    db: mssql-source
    when: post_start

topology: single
requires: [mssql]

assert:
  smoke: true
  diff:
    - source: ${MSSQL_SOURCE_SCHEMA}.${TID}SRC       # read via qasource (source_db: mssql-source)
      target: ${MSSQL_TARGET_SCHEMA}.${TID}TGT       # read via qatarget
      source_db: mssql-source
      target_db: mssql-target

timeout: 180
tags: [diff, cdc, mssql, regression]
