name: file-diff
depth: smoke
purpose: File-in -> file-out proof of the file-assertion tier; exercises FileReader, FileWriter, and the mode-aware server-file read/place (docker exec / native fs)

tql: app.tql

topology: single
requires: []

server_files:
  - {file: input.csv, dest: '/tmp/${NS}-in/input.csv', when: pre_deploy}

assert:
  smoke: true
  file:
    - path: /tmp/${NS}-out
      match: expected/events.csv   # DSVParser without a typed output stream keys columns positionally (0,1,...); golden headers match
      project: data

timeout: 180
tags: [file, filereader, filewriter, regression]
