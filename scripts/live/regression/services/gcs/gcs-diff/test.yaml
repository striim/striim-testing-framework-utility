name: gcs-diff
depth: smoke
purpose: Round-trip through the GCS emulator — GCSReader (DSV) from the source bucket to GCSWriter (DSV) on the target bucket

tql: app.tql

seed:
  - file: source.csv   # GcsAdmin uploads this to ${GCS_SRC_BUCKET}
    db: gcs

topology: single
requires: [gcs]

assert:
  smoke: true
  diff:
    - source: ${GCS_SRC_BUCKET}
      source_db: gcs
      target: ${GCS_TGT_BUCKET}
      target_db: gcs

timeout: 180
tags: [diff, gcs, regression]
