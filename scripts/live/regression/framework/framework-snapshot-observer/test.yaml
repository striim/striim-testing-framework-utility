name: framework-snapshot-observer
purpose: Every observed pair of target tables equals one complete committed source
  prefix.
tql: app.tql
topology: single
requires:
- postgres
timeout: 180
tags:
- framework
- snapshot
ddl:
- file: ddl_source.sql
  db: postgres-source
- file: ddl_target.sql
  db: postgres-target
- file: slot.sql
  db: postgres-source
exact:
  version: 1
assert:
  data:
  - target: ${PG_TARGET_SCHEMA}.${TID}tgt
    db: postgres-target
    match: expected/rows.csv
    exact:
      columns:
        id: integer
lifecycle:
  version: 1
  mode: cdc
  sink: db
  readiness:
    kind: source-progress
    db: postgres-source
  completion:
    kind: row-count
    db: postgres-target
    table: ${PG_TARGET_SCHEMA}.${TID}tgt
    expect: 2
  stability: 5s
  deadlines:
    readiness: 90s
    completion: 120s
  reset: owned
recover:
  mode: stop
  after: 0
  settle: 1
transactions:
- session: a
  op: begin
  db: postgres-source
- session: b
  op: begin
  db: postgres-source
- session: a
  op: sql
  file: a.sql
- session: a
  op: savepoint
  name: keep
- session: a
  op: sql
  file: discard.sql
- session: a
  op: rollback_to
  name: keep
- session: b
  op: sql
  file: b.sql
- session: b
  op: commit
- session: a
  op: commit
  when: post_recover
snapshot_observer:
  db: postgres-target
  tables:
    a:
      target: ${PG_TARGET_SCHEMA}.${TID}tgt
      columns:
        id: integer
        msg: text
    b:
      target: ${PG_TARGET_SCHEMA}.${TID}tgt_aux
      columns:
        id: integer
        msg: text
  prefixes:
  - a: expected/empty.csv
    b: expected/empty.csv
  - a: expected/b.csv
    b: expected/b.csv
  - a: expected/rows.csv
    b: expected/rows.csv
  interval: 50ms
