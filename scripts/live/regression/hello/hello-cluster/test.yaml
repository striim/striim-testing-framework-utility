name: hello-cluster
depth: smoke

tql: app.tql

ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed: seed.sql

topology: cluster
requires: [postgres]

assert:
  smoke: true
  diff:
    - source: ${PG_SOURCE_SCHEMA}.${TID}src
      target: ${PG_TARGET_SCHEMA}.${TID}tgt
      target_db: postgres-target

timeout: 180
tags: [smoke, regression, cluster, postgres]
