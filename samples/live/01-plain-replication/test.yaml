name: plain-replication
purpose: Replicate three Postgres rows as an initial load and compare the target exactly with a reviewed golden
tql: app.tql
topology: single
requires: [postgres]
timeout: 180
tags: [sample, initial-load, postgres, exact]
ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed:
  - file: seed.sql
    db: postgres-source
    when: pre_deploy
exact: {version: 1, max_rows: 10}
assert:
  smoke: true
  data:
    - target: "${PG_TARGET_SCHEMA}.${TID}tgt"
      target_db: postgres-target
      match: expected/rows.csv
      exact:
        columns: {id: integer, amount: "decimal:2", created_at: timestamptz}
lifecycle:
  version: 1
  mode: initial-load
  sink: db
  readiness:
    kind: baseline-landed
    source: {db: postgres-source, table: "${PG_SOURCE_SCHEMA}.${TID}src"}
    target: {db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}tgt"}
  completion:
    kind: source-count
    source: {db: postgres-source, table: "${PG_SOURCE_SCHEMA}.${TID}src"}
    target: {db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}tgt"}
  stability: 2s
  deadlines: {readiness: 90s, completion: 120s}
  reset: owned
