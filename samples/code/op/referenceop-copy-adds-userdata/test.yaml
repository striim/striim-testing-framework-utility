name: referenceop-copy-adds-userdata
purpose: "copies every event through unchanged and stamps userdata.processed=true on each copy"

example: samples/code/op/java/OpenProcessors/ReferenceOp/examples/copy-adds-userdata
tql: app.tql

op:
  jar: samples/code/op/java/OpenProcessors/ReferenceOp

ddl:
  - file: source_postgres_ddl.sql
    db: postgres-source
  - file: target_postgres_ddl.sql
    db: postgres-target
seed:
  - file: source_postgres_seed.sql
    db: postgres-source
    when: pre_deploy

topology: single
requires: [postgres]

exact: {version: 1, max_rows: 10}
assert:
  smoke: true
  data:
    - target: ${PG_TARGET_SCHEMA}.${TID}items
      target_db: postgres-target
      match: expected/items.csv
      exact:
        columns: {id: integer}
  file:
    # One golden row per event: the seed has two rows, so exactly two events, each stamped.
    # An event the operator forwards unstamped (its error path) or delivers twice fails.
    - path: ${OWNED_DIR}/out.json
      project: userdata
      keys: [processed]
      events: 2
      multiset: true
      match: expected/userdata.csv
lifecycle:
  version: 1
  mode: initial-load
  sink: db
  readiness:
    kind: baseline-landed
    source: {db: postgres-source, table: "${PG_SOURCE_SCHEMA}.${TID}items"}
    target: {db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}items"}
  completion:
    kind: source-count
    source: {db: postgres-source, table: "${PG_SOURCE_SCHEMA}.${TID}items"}
    target: {db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}items"}
  stability: 2s
  deadlines: {readiness: 90s, completion: 120s}
  reset: owned

timeout: 180
tags: [op, referenceop, postgres, sample]
