name: exact-diff-declared
purpose: hermetic exact fixture - the target holds exactly the source rows (mapping-form diff exact)
tql: app.tql
requires: [postgres]
timeout: 5
ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed:
  - file: seed.sql
    db: postgres-source
    when: pre_deploy
exact: {version: 1}
assert:
  smoke: true
  diff:
    - source: "${PG_SOURCE_SCHEMA}.${TID}src"
      source_db: postgres-source
      target: "${PG_TARGET_SCHEMA}.${TID}tgt"
      target_db: postgres-target
      exact: {columns: {id: integer}}
lifecycle:
  version: 1
  mode: initial-load
  sink: db
  readiness:
    kind: baseline-landed
    source: {db: postgres-source, table: "${PG_SOURCE_SCHEMA}.${TID}src"}
    target: {db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}tgt"}
  completion:
    kind: source-count
    source: {db: postgres-source, table: "${PG_SOURCE_SCHEMA}.${TID}src"}
    target: {db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}tgt"}
  stability: 0s
  deadlines: {readiness: 3s, completion: 3s}
  reset: owned
