name: lc-cdc-sentinel
purpose: hermetic lifecycle fixture - CDC with ready and done sentinels (the only witness for an empty result)
tql: app.tql
requires: [postgres]
timeout: 30
ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed:
  - file: changes.sql
    db: postgres-source
    when: post_start
assert:
  smoke: true
lifecycle:
  version: 1
  mode: cdc
  sink: db
  readiness: {kind: sentinel}
  completion: {kind: sentinel}
  stability: 0s
  deadlines: {readiness: 3s, completion: 3s}
  reset: owned
  sentinel:
    db: postgres-source
    insert: sentinel_insert.sql
    delete: sentinel_delete.sql
    observe: {db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}tgt", key: id}
