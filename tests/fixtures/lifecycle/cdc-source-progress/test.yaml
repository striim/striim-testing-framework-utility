name: lc-cdc-source-progress
purpose: hermetic lifecycle fixture - CDC readiness from the run-scoped replication slot, positive row count
tql: app.tql
requires: [postgres]
timeout: 30
ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed:
  - file: changes.sql
    db: postgres-source
    when: post_start
assert:
  smoke: true
lifecycle:
  version: 1
  mode: cdc
  sink: db
  readiness: {kind: source-progress, db: postgres-source}
  completion: {kind: row-count, db: postgres-target, table: "${PG_TARGET_SCHEMA}.${TID}tgt", expect: 2}
  stability: 0s
  deadlines: {readiness: 3s, completion: 3s}
  reset: owned
