name: or-recover-node
purpose: hermetic orchestration fixture - a node fault interrupts and restores through a fresh fault target each cycle
tql: app.tql
requires: [postgres]
timeout: 30
ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed:
  - file: seed.sql
    db: postgres-source
    when: pre_deploy
recover: {mode: stop, node: primary, times: 2, after: 0, every: 0, settle: 0}
exact: {version: 1}
assert:
  smoke: true
  data:
    - target: "${PG_TARGET_SCHEMA}.${TID}tgt"
      target_db: postgres-target
      match: expected/tgt.csv
      exact: {columns: {id: integer}}
