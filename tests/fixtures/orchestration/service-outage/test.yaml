name: or-service-outage
purpose: hermetic orchestration fixture - service_outage takes the source service down once while a concurrent SQL loop runs against it
tql: app.tql
requires: [postgres]
timeout: 30
ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed:
  - file: seed.sql
    db: postgres-source
    when: pre_deploy
action:
  - type: service_outage
    service: postgres
    cycles: 1
    delay_before: 0
    down_for: 0
    settle: 0
    concurrent:
      - {db: postgres-source, file: feed.sql, loop_interval: 50ms}
exact: {version: 1}
assert:
  smoke: true
  data:
    - target: "${PG_TARGET_SCHEMA}.${TID}tgt"
      target_db: postgres-target
      match: expected/tgt.csv
      exact: {columns: {id: integer}}
