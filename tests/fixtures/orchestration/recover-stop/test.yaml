name: or-recover-stop
purpose: hermetic orchestration fixture - recover stops and restores the app twice, seeds post_recover after the last restore, then asserts
tql: app.tql
requires: [postgres]
timeout: 30
ddl:
  - file: ddl_source.sql
    db: postgres-source
  - file: ddl_target.sql
    db: postgres-target
seed:
  - file: seed.sql
    db: postgres-source
    when: pre_deploy
  - file: late.sql
    db: postgres-source
    when: post_recover
recover: {mode: stop, times: 2, after: 0, every: 0, settle: 0}
exact: {version: 1}
assert:
  smoke: true
  data:
    - target: "${PG_TARGET_SCHEMA}.${TID}tgt"
      target_db: postgres-target
      match: expected/tgt.csv
      exact: {columns: {id: integer}}
